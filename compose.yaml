# FreeCord single-host stack for Portainer's Web Editor or Docker Compose.
# First deployment requires only:
#   LIVEKIT_URL=wss://rtc.example.com
#   FREECORD_INITIAL_ADMIN_PASSWORD=a-unique-password-at-least-12-characters
services:
  config-init:
    image: ghcr.io/calebast/freecord-api:${FREECORD_IMAGE_TAG:-latest}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    entrypoint: ["/usr/local/bin/freecord-config-init"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    environment:
      # Optional first-start overrides. Normally leave these blank.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - config-state:/run/freecord-state
      - postgres-config:/run/freecord-postgres
      - api-config:/run/freecord-api
      - livekit-config:/run/freecord-livekit
      - minio-config:/run/freecord-minio
      - postgres-data:/state/postgres:ro
      - minio-data:/state/minio:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      config-init: { condition: service_completed_successfully }
    environment:
      POSTGRES_DB: freecord
      POSTGRES_USER: freecord
      POSTGRES_PASSWORD_FILE: /run/freecord-postgres/postgres-password
    volumes:
      - postgres-config:/run/freecord-postgres:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freecord -d freecord"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    depends_on:
      config-init: { condition: service_completed_successfully }
    command: ["--config", "/run/freecord-livekit/livekit.yaml"]
    volumes:
      - livekit-config:/run/freecord-livekit:ro
    ports:
      - "${LIVEKIT_SIGNALING_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT_RANGE:-50000-50010}:50000-50010/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/; code=$$?; test $$code -eq 0 -o $$code -eq 8"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: ghcr.io/calebast/freecord-minio:${FREECORD_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      config-init: { condition: service_completed_successfully }
    volumes:
      - minio-config:/run/freecord-minio:ro
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: ghcr.io/calebast/freecord-minio:${FREECORD_IMAGE_TAG:-latest}
    restart: "no"
    entrypoint: ["/usr/local/bin/freecord-minio-init"]
    depends_on:
      config-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    environment:
      MINIO_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-freecord-media}
    volumes:
      - minio-config:/run/freecord-minio:ro

  config-finalize:
    image: ghcr.io/calebast/freecord-api:${FREECORD_IMAGE_TAG:-latest}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    entrypoint: ["/usr/local/bin/freecord-config-finalize"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "FOWNER"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes:
      - config-state:/run/freecord-state

  api:
    image: ghcr.io/calebast/freecord-api:${FREECORD_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      config-finalize: { condition: service_completed_successfully }
      livekit: { condition: service_healthy }
    environment:
      NODE_ENV: production
      POSTGRES_DB: freecord
      POSTGRES_USER: freecord
      DATABASE_SSL: "false"
      FREECORD_INITIAL_ADMIN_USERNAME: ${FREECORD_INITIAL_ADMIN_USERNAME:-admin}
      FREECORD_INITIAL_ADMIN_PASSWORD: ${FREECORD_INITIAL_ADMIN_PASSWORD:-}
      FREECORD_COMMUNITY_NAME: ${FREECORD_COMMUNITY_NAME:-FreeCord}
      FREECORD_COMMUNITY_SLUG: ${FREECORD_COMMUNITY_SLUG:-freecord}
      LIVEKIT_URL: ${LIVEKIT_URL:?set the public LiveKit wss URL}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-60}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-600}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-freecord-media}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-26214400}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    volumes:
      - api-config:/run/freecord-api:ro
    ports:
      - "${FREECORD_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  config-state:
  postgres-config:
  api-config:
  livekit-config:
  minio-config:
  postgres-data:
  minio-data:
