# Persistent PipeWire Pulse test devices for a hardware-free CachyOS VM.
# Install as:
#   ~/.config/pipewire/pipewire-pulse.conf.d/99-freecord-test-audio.conf

pulse.cmd = [
  { cmd = "load-module" args = "module-null-sink sink_name=freecord_test_speaker sink_properties=device.description=FreeCord-Test-Speaker rate=48000 channels=2 channel_map=front-left,front-right" flags = [ ] }
  { cmd = "load-module" args = "module-null-sink sink_name=freecord_test_microphone_bus sink_properties=device.description=FreeCord-Test-Microphone-Bus rate=48000 channels=1 channel_map=mono" flags = [ ] }
  { cmd = "load-module" args = "module-remap-source master=freecord_test_microphone_bus.monitor source_name=freecord_test_microphone source_properties=device.description=FreeCord-Test-Microphone rate=48000 channels=1 channel_map=mono master_channel_map=mono" flags = [ ] }
]
