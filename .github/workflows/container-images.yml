name: Container images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - database/**
      - server/**
      - .github/workflows/container-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.repository == 'calebast/FreeCord'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: python -m unittest tests.test_compose_secret_defaults tests.test_compose_livekit_service -v
      - name: Validate Compose
        env:
          LIVEKIT_URL: wss://rtc.example.invalid
          FREECORD_INITIAL_ADMIN_PASSWORD: ci-bootstrap-password
        run: docker compose config --quiet

  publish:
    if: github.repository == 'calebast/FreeCord'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: freecord-api
            dockerfile: server/Dockerfile
          - image: freecord-minio
            dockerfile: server/minio.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=FreeCord self-hosted service image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=BSD-3-Clause
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: APP_VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
